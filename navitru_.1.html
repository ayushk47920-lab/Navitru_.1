<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a6b6b">
<meta name="description" content="Navitru hospital navigation interface with floor maps and voice directions.">
<title>Navitru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#0a6b6b; --teal-2:#0c7a78; --ink:#0f3d4a; --muted:#5d7a86; --line:#cfe3e6;
  --orange:#f58a1f; --pad:clamp(12px,3vw,28px); color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Poppins','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--ink);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#eef8f8 0%,#ffffff 45%,#f1faf9 100%);
}
body:has(dialog[open]){overflow:hidden}
button{font-family:inherit}
.ico{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- header ---------- */
.top{background:linear-gradient(90deg,#0a6b6b,#0c7a78);color:#fff;padding-top:env(safe-area-inset-top)}
.top-in{max-width:1180px;margin:0 auto;padding:14px var(--pad);display:flex;align-items:center;gap:clamp(10px,2.5vw,28px);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:clamp(32px,5.5vw,50px);height:auto;flex:none}
.brand-name{font-weight:700;font-size:clamp(24px,4.4vw,40px);line-height:1}
.lang{margin-left:auto;display:flex;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.85);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:#fff;font-weight:600;font-size:clamp(13px,2vw,17px);padding:8px clamp(14px,2.4vw,28px);border-radius:999px;cursor:pointer;min-height:36px}
.lang button.on{background:#fff;color:var(--teal)}
@media(max-width:640px){
  .lang{order:2}
}

/* ---------- layout ---------- */
.wrap{width:100%;max-width:1180px;margin:0 auto;padding:clamp(12px,2.6vw,26px) var(--pad) 0;display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(12px,2vw,20px)}
.wrap>*,.panel,.mapcard,.mapwrap{min-width:0}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:clamp(10px,2vw,18px)}
.sel{position:relative;display:block;height:clamp(70px,9vw,88px);background:#fff;border:1.5px solid var(--line);border-radius:18px;box-shadow:0 2px 10px rgba(10,80,90,.06);cursor:pointer}
.sel:focus-within{outline:3px solid #8fd3c4;outline-offset:2px}
.sel .si{position:absolute;left:clamp(12px,2vw,20px);top:50%;transform:translateY(-50%);font-size:clamp(30px,4.4vw,44px);color:var(--teal)}
.sel .sl{position:absolute;left:clamp(62px,8vw,92px);top:clamp(10px,1.6vw,16px);right:40px;font-size:clamp(12px,1.7vw,15px);color:var(--muted);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel select{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;appearance:none;-webkit-appearance:none;cursor:pointer;font-family:inherit;font-weight:600;font-size:clamp(16px,2.4vw,22px);color:var(--ink);padding:clamp(26px,3.4vw,34px) 44px 0 clamp(62px,8vw,92px);border-radius:18px;text-overflow:ellipsis;outline:none}
.sel .sc{position:absolute;right:16px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:18px}

.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,2vw,18px)}
.qc{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;border:1.5px solid;text-align:left;cursor:pointer;min-height:84px;width:100%;transition:transform .15s,box-shadow .15s}
.qc:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(10,80,90,.12)}
.qc:focus-visible{outline:3px solid #8fd3c4;outline-offset:2px}
.qc .ci{width:clamp(46px,6vw,64px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(24px,3.4vw,32px);flex:none;box-shadow:0 5px 12px rgba(10,80,90,.16),inset 0 0 0 3px rgba(255,255,255,.65)}
.qc .tx{min-width:0}
.qc b{display:block;font-size:clamp(15px,2.2vw,19px);font-weight:600}
.qc small{display:block;font-size:clamp(12px,1.6vw,14px);color:var(--muted);margin-top:1px}
.qc .chev{margin-left:auto;font-size:20px;opacity:.7}
.qc.green{background:linear-gradient(135deg,#e4f6ef,#f2fbf8);border-color:#bfe6d8;color:#0f5f4d}
.qc.green .ci{background:linear-gradient(135deg,#c4f0dd,#8fdcbc);color:#0b6b55}
.qc.blue{background:linear-gradient(135deg,#e3eefb,#f1f7fd);border-color:#bcd6f3;color:#1d4f8a}
.qc.blue .ci{background:linear-gradient(135deg,#d3e6fb,#9ec6f2);color:#1b5fae}
.qc.orange{background:linear-gradient(135deg,#fff0df,#fff8ef);border-color:#f6d3a8;color:#8a4a06}
.qc.orange .ci{background:linear-gradient(135deg,#ffe3c2,#fbc17a);color:#d97706}
@media(max-width:860px){
  .qc{flex-direction:column;justify-content:center;text-align:center;gap:8px;padding:14px 8px;min-height:0}
  .qc .chev{display:none}
  .qc .ci{width:clamp(48px,11vw,60px);font-size:clamp(24px,6vw,30px)}
  .qc b{font-size:clamp(12.5px,2.6vw,16px);line-height:1.25}
  .qc small{font-size:clamp(11px,2vw,13px);line-height:1.3}
}
@media(max-width:520px){.qc small{display:none}}

/* ---------- route panel ---------- */
.panel{border:1.5px solid var(--line);border-radius:22px;background:rgba(255,255,255,.78);padding:clamp(10px,2.6vw,24px)}
.panel-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.panel-h .pi{font-size:clamp(30px,5vw,46px);color:var(--teal);display:grid;flex:none}
.ph-body{min-width:0}
.title-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.panel-h h2{font-size:clamp(20px,3.4vw,32px);font-weight:700;line-height:1.15}
.panel-h p{color:var(--muted);font-size:clamp(13px,1.9vw,18px);margin-top:2px}
.vbtn{position:relative;width:clamp(40px,5vw,50px);aspect-ratio:1;border-radius:50%;border:0;background:linear-gradient(135deg,#12a39d,#0a6b6b);color:#fff;display:grid;place-items:center;font-size:clamp(20px,2.6vw,25px);cursor:pointer;box-shadow:0 6px 14px rgba(10,107,107,.35);flex:none}
.vbtn.on{background:linear-gradient(135deg,#f7a137,#f08a00);box-shadow:0 6px 14px rgba(240,138,0,.4)}
.vbtn.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid #f7a137;animation:ring 1.4s ease-out infinite}
@keyframes ring{from{transform:scale(.9);opacity:.9}to{transform:scale(1.35);opacity:0}}
.vbtn:focus-visible{outline:3px solid #8fd3c4;outline-offset:3px}
.panel .pick{margin-bottom:14px}

.mapcard{border:1.5px solid var(--line);border-radius:20px;background:linear-gradient(180deg,#f7fcfc,#eef7f8);padding:clamp(8px,2vw,16px)}
.maptop{display:flex;margin-bottom:10px;overflow-x:auto}
.tabs{display:flex;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px;gap:2px}
.tab{border:0;background:transparent;border-radius:10px;padding:10px clamp(12px,2.5vw,26px);font-weight:500;font-size:clamp(13px,1.8vw,16px);color:#41606c;cursor:pointer;white-space:nowrap;position:relative;min-height:42px}
.tab.on{background:var(--teal);color:#fff;font-weight:600}
.tab .short{display:none}
.tab.route::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--orange)}
.tab:focus-visible{outline:3px solid #8fd3c4;outline-offset:1px}
@media(max-width:560px){.tab .long{display:none}.tab .short{display:inline}.tabs{width:100%}.tab{flex:1}}

.mapwrap{position:relative}
.mapscroll{position:relative;border-radius:16px;background:#f6fbfd;border:1px solid #dcebf0;overflow:auto;max-height:min(80vh,780px);-webkit-overflow-scrolling:touch;cursor:grab}
.mapscroll.drag{cursor:grabbing;user-select:none}
#mapSvg{display:block;height:auto;max-width:none;margin:0 auto}
#mapSvg text{font-family:'Poppins','Noto Sans Devanagari',system-ui,sans-serif}
.lobby-t text{paint-order:stroke;stroke:#eef4f7;stroke-width:4px;stroke-linejoin:round}
.flow{animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-11.1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.5}to{transform:scale(2.8);opacity:0}}
.zoom{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;background:#fff;border-radius:12px;box-shadow:0 4px 14px rgba(10,60,70,.2);overflow:hidden;z-index:2}
.zoom button{width:44px;height:44px;border:0;background:#fff;font-size:21px;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.zoom button+button{border-top:1px solid #e3eef1}
.zoom button:focus-visible{outline:3px solid #8fd3c4;outline-offset:-3px}
.mapbar{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:10px}
.floorsel{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 10px;box-shadow:0 4px 12px rgba(10,60,70,.1);font-size:20px;color:var(--teal)}
.floorsel select{border:0;background:transparent;font-family:inherit;font-weight:500;font-size:15px;color:var(--ink);padding:6px 2px;cursor:pointer;outline:none}
.mini{width:clamp(88px,14vw,130px);background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 4px 12px rgba(10,60,70,.1)}
.mini svg{display:block;width:100%;height:auto}
@media(min-width:720px){
  .mapbar{position:absolute;left:12px;right:12px;bottom:12px;margin:0;pointer-events:none}
  .floorsel{pointer-events:auto}
}
.summary{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:500;font-size:clamp(13px,1.8vw,15px);color:#33565f}
.chip.ok{background:#e4f6ef;border-color:#bfe6d8;color:#0f5f4d}

.dirs{margin-top:14px;border:1.5px solid var(--line);border-radius:18px;background:#fff;padding:clamp(12px,2.5vw,20px)}
.dirs-h{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-bottom:14px}
.dirs-h h3{display:flex;align-items:center;gap:10px;font-size:clamp(17px,2.6vw,22px);color:var(--teal);font-weight:600}
.dirs-h h3 .ico{font-size:1.2em}
.dirs .summary{margin:0}
.steps{list-style:none;padding:0;display:grid;gap:0}
.steps:empty{display:none}
.steps li{position:relative;display:flex;gap:14px;align-items:flex-start;padding-bottom:14px}
.steps li:last-child{padding-bottom:0}
.steps li:not(:last-child)::after{content:"";position:absolute;left:19px;top:42px;bottom:2px;width:2px;background:#d3e6e9;border-radius:2px}
.st-i{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:#fff;background:var(--c,#0a6b6b);box-shadow:0 3px 8px rgba(10,80,90,.22);position:relative;z-index:1}
.st-i .ico{stroke-width:2.4}
.st-t{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 14px;border-radius:12px;background:#f3fafa;border:1px solid transparent;font-size:clamp(14px,1.9vw,16px);line-height:1.4;min-height:40px}
.steps li.now .st-t{background:#fff1e0;border-color:#f6b25f}
.steps .fl{flex:none;font-size:12px;font-weight:600;color:var(--teal);background:#d9eeee;border-radius:999px;padding:2px 9px}
.st-start{--c:#0e9f8e}.st-straight{--c:#2f8ae6}.st-left,.st-right,.st-back{--c:#f08a00}.st-lift{--c:#7e57c2}.st-arrive{--c:#2fa75c}

footer{margin-top:auto;text-align:center;padding:26px 16px calc(22px + env(safe-area-inset-bottom));color:#4b6d78;font-size:14px;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
footer .ico{color:#1a9a8e;fill:#1a9a8e;font-size:18px}
footer b{color:var(--teal);font-weight:600}
footer i{width:1px;height:16px;background:#9fb9c0}

/* ---------- dialog + toast ---------- */
dialog{border:0;border-radius:22px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;box-shadow:0 20px 60px rgba(8,50,60,.35);color:var(--ink);background:#fff}
dialog::backdrop{background:rgba(8,40,48,.45);backdrop-filter:blur(2px)}
@media(max-width:560px){dialog{margin:auto auto 0;border-radius:22px 22px 0 0;width:100vw;max-width:100vw}}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}
.dlg-h h2{font-size:20px;font-weight:600;color:var(--teal)}
.x{width:40px;height:40px;border-radius:50%;border:0;background:#eef5f6;color:var(--ink);cursor:pointer;display:grid;place-items:center;font-size:20px}
#dlgBody{padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.form{display:grid;gap:12px}
.fld{display:grid;gap:5px;font-size:14px;color:var(--muted);font-weight:500}
.fld input,.fld select{border:1.5px solid var(--line);border-radius:12px;padding:12px;font-family:inherit;font-size:16px;color:var(--ink);background:#fff;min-height:46px;width:100%}
.fld input:focus,.fld select:focus{outline:3px solid #8fd3c4;outline-offset:1px}
.btn{border:0;border-radius:12px;background:var(--teal);color:#fff;padding:13px 18px;font-weight:600;font-size:16px;cursor:pointer;min-height:48px}
.btn.sm{padding:8px 14px;min-height:38px;font-size:14px}
.note{font-size:13px;color:var(--muted);margin-bottom:12px}
.list{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px}
.list li{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.list .grow{flex:1;min-width:0}
.list .grow b{display:block;font-weight:600;overflow-wrap:anywhere}
.list .grow small{color:var(--muted)}
.tm{background:#d9eeee;color:var(--teal);border-radius:8px;padding:4px 9px;font-weight:600;font-size:14px}
.ghost{border:0;background:#fdeaea;color:#c0392b;width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:16px;display:grid;place-items:center}
.empty{color:var(--muted);text-align:center;padding:14px 0}
.okbox{background:#e4f6ef;border:1px solid #bfe6d8;border-radius:14px;padding:16px;color:#0f5f4d;display:grid;gap:8px;justify-items:start}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:#0f3d4a;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:.25s;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

/* ================= ROUTING ================= */
function simplify(pts) {
  const p = pts.map(a => a.slice());
  let changed = true;
  while (changed) {
    changed = false;
    for (let i = p.length - 1; i > 0; i--) {
      if (p[i][0] === p[i - 1][0] && p[i][1] === p[i - 1][1]) { p.splice(i, 1); changed = true; }
    }
    for (let i = 1; i < p.length - 1; i++) {
      const a = p[i - 1], b = p[i], c = p[i + 1];
      const cross = (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]);
      if (cross === 0) { p.splice(i, 1); changed = true; break; }   // straight-through or back-track
    }
  }
  return p;
}

  const up = FIDX[D.floor] > FIDX[A.floor];
  return { from: A, to: D, cross: true, legs: [
    { floor: A.floor, pts: simplify(back), lift: { dir: up ? '↑' : '↓', other: D.floor } },

    let heading = null;

      const a = leg.pts[i], b = leg.pts[i + 1];
      const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);

}
function renderDlg() {
  const k = state.dlg; if (!k) return;
  $('#dlgTitle').textContent = t(k);
  const body = $('#dlgBody'); body.replaceChildren();
  ({ med: medBody, hist: histBody, missed: missedBody })[k](body);
}
function openDlg(k) { state.dlg = k; renderDlg(); const d = $('#dlg'); if (!d.open) d.showModal(); }

/* medicine reminders fire while the page is open */
let lastFired = '';
setInterval(() => {
  const n = new Date(), hm = String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0'), key = n.toDateString() + hm;
  if (key === lastFired) return;
  const due = store.get('navitru.meds', []).filter(m => m.t === hm);
  if (!due.length) return;
  lastFired = key;
  const msg = t('timeFor') + ' ' + due.map(m => m.n).join(', ');
  toast(msg, 9000);
  try { if ('Notification' in window && Notification.permission === 'granted') new Notification('Navitru', { body: msg }); } catch (e) {}
}, 15000);

/* ================= EVENTS + INIT ================= */
$('#from').addEventListener('change', e => { state.from = e.target.value; setRoute(true); });
$('#to').addEventListener('change', e => { state.to = e.target.value; setRoute(true); });
$('#floorSel').addEventListener('change', e => setFloor(e.target.value));
$$('.lang button').forEach(b => b.addEventListener('click', () => {
  state.lang = b.dataset.lang; store.set('navitru.lang', state.lang); applyLang();
}));
$('#zin').addEventListener('click', () => zoomBy(1.25));
$('#zout').addEventListener('click', () => zoomBy(0.8));
$('#zloc').addEventListener('click', () => {
  const leg = ((state.route && state.route.legs) || []).find(l => l.floor === state.floor);
  const p = leg ? leg.pts[0] : (LOC[state.from].floor === state.floor ? LOC[state.from].path[LOC[state.from].path.length - 1] : H);
  centerOn(p[0], p[1], true);
});
$('#voiceBtn').addEventListener('click', playSteps);
$$('[data-open]').forEach(b => b.addEventListener('click', () => openDlg(b.dataset.open)));
$('#dlgClose').addEventListener('click', () => $('#dlg').close());
$('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) $('#dlg').close(); });
$('#dlg').addEventListener('close', () => { state.dlg = null; });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => applyZoom(true), 120); });
(() => {   // mouse drag-to-pan (touch uses native scrolling)
  const sc = $('#mapScroll'); let drag = null;
  sc.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY, l: sc.scrollLeft, t: sc.scrollTop };
    sc.setPointerCapture(e.pointerId); sc.classList.add('drag');
  });
  sc.addEventListener('pointermove', e => { if (!drag) return; sc.scrollLeft = drag.l - (e.clientX - drag.x); sc.scrollTop = drag.t - (e.clientY - drag.y); });
  const end = () => { drag = null; sc.classList.remove('drag'); };
  sc.addEventListener('pointerup', end); sc.addEventListener('pointercancel', end);
})();

applyZoom(false);
applyLang();
})();
</script>
</body>
</html>
